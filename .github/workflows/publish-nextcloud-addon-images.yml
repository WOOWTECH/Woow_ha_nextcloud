name: Publish Nextcloud Office add-on image

# A version bump in woow-nextcloud-office/config.yaml on main builds and pushes the
# prebuilt image Home Assistant installs (no on-device build) and checks it; the job
# "Release" then calls the Store's shared woow-addon-release.yml, which creates the
# v<version> GitHub Release that Woow_HA_App_Store syncs from. A version that already
# has a Release is not rebuilt (same-version images are immutable). Pushes to rc/**
# build a release-candidate tag for isolated testing and never create a Release.
# Pull requests run the unit tests and build the image without pushing it, then run
# the same container smoke test (jobs "Unit tests" and "Build and smoke test amd64
# image"); "Upgrade comparison / compare" compares a version bump with the latest
# formal Release. These are the checks to require before merging.

on:
  pull_request:
  push:
    branches:
      - main
      - 'rc/**'
    paths:
      - woow-nextcloud-office/**
      - .github/workflows/publish-nextcloud-addon-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nextcloud-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/woowtech/woow-ha-nextcloud-office-amd64

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Run unit and static tests
        working-directory: woow-nextcloud-office
        run: |
          set -e
          for t in test/test-*.py; do echo "== $t"; python3 "$t"; done
          for f in $(find rootfs -type f \( -name run -o -name up \)) rootfs/usr/local/bin/* build/*.sh test/*.sh; do bash -n "$f"; done

  smoke:
    name: Build and smoke test amd64 image
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: v
        shell: bash
        run: |
          version="$(awk -F': ' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' woow-nextcloud-office/config.yaml)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          nc="$(awk -F= '/^ARG NEXTCLOUD_VERSION=/{print $2; exit}' woow-nextcloud-office/Dockerfile)"
          [[ "${nc}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "nextcloud=${nc}" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      # Same build as publish, loaded into the local daemon instead of pushed.
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./woow-nextcloud-office
          file: ./woow-nextcloud-office/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: local/woow-ha-nextcloud-office-amd64:pr-${{ github.event.pull_request.number }}
          build-args: |
            BUILD_ARCH=amd64
            TARGETARCH=amd64
            BUILD_VERSION=${{ steps.v.outputs.version }}
            BUILD_DATE=${{ steps.v.outputs.created }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}

      # The SBOM of this image is what the Upgrade comparison scans as the
      # new version (pipeline #89, category 4): pinned Syft from the Store,
      # uploaded as artifact upgrade-comparison-sbom-woow-nextcloud-office.
      - name: SBOM for the upgrade comparison
        uses: WOOWTECH/Woow_HA_App_Store/.github/actions/addon-sbom@feat/89-upgrade-comparison
        with:
          component: woow-nextcloud-office
          image: local/woow-ha-nextcloud-office-amd64:pr-${{ github.event.pull_request.number }}

      - name: Smoke test the image (versions + real /init boot)
        run: woow-nextcloud-office/test/ci-image-smoke.sh "local/woow-ha-nextcloud-office-amd64:pr-${{ github.event.pull_request.number }}" "${{ steps.v.outputs.nextcloud }}"

  # Upgrade comparison (pipeline #89): a PR that bumps the add-on version is
  # compared with the latest formal Release. A breaking config.yaml change
  # not declared in woow-nextcloud-office/upgrade-notes.yaml blocks it, and so
  # does a new fixable Critical/High vulnerability in the amd64 image (the
  # SBOM from the smoke job against the Release's GHCR image) unless that file
  # accepts it. No needs: on the build, so a PR that changes no version passes
  # in seconds; after a version bump the job waits for this run's SBOM
  # artifact (actions: read) and fails if the smoke job never uploads it. On
  # push the job passes at once, so this workflow's non-PR run (registry
  # required_workflows) still succeeds. Reported as
  # "Upgrade comparison / compare". The PR image and the published image are
  # both built without a layer cache, so the SBOM is of what the Release ships.
  upgrade-comparison:
    name: Upgrade comparison
    permissions:
      contents: read
      actions: read
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-upgrade-check.yml@feat/89-upgrade-comparison
    with:
      tooling_ref: feat/89-upgrade-comparison
      sbom_artifact: upgrade-comparison-sbom-*

  publish:
    name: Build, check and publish amd64 image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: v
        shell: bash
        run: |
          version="$(awk -F': ' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' woow-nextcloud-office/config.yaml)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          nc="$(awk -F= '/^ARG NEXTCLOUD_VERSION=/{print $2; exit}' woow-nextcloud-office/Dockerfile)"
          [[ "${nc}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then tag="${version}"; release=true; else tag="${version}-rc.${GITHUB_RUN_NUMBER}"; release=false; fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "nextcloud=${nc}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release=${release}" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Skip a version that is already released
        id: released
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::v${VERSION} is already released; its image is not rebuilt"
            echo "done=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check the CHANGELOG has this version
        if: steps.v.outputs.release == 'true' && steps.released.outputs.done != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: grep -qxF "## ${VERSION}" woow-nextcloud-office/CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## ${VERSION}' section"; exit 1; }

      - name: Free disk space
        if: steps.released.outputs.done != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3
        if: steps.released.outputs.done != 'true'

      - uses: docker/login-action@v3
        if: steps.released.outputs.done != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile verifies the Nextcloud archive (pinned SHA256 + release signature)
      # before unpacking it; a mismatch fails the build.
      - name: Build and push image
        if: steps.released.outputs.done != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./woow-nextcloud-office
          file: ./woow-nextcloud-office/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
          build-args: |
            BUILD_ARCH=amd64
            TARGETARCH=amd64
            BUILD_VERSION=${{ steps.v.outputs.version }}
            BUILD_DATE=${{ steps.v.outputs.created }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}

      - name: Smoke test the pushed image (versions + real /init boot)
        if: steps.released.outputs.done != 'true'
        run: woow-nextcloud-office/test/ci-image-smoke.sh "${IMAGE}:${{ steps.v.outputs.tag }}" "${{ steps.v.outputs.nextcloud }}"

      # Home Assistant pulls without credentials. A new GHCR package starts out private;
      # releasing then would publish a version nobody can install.
      - name: Check the image is publicly pullable
        if: steps.released.outputs.done != 'true'
        run: |
          docker logout ghcr.io
          if ! docker manifest inspect "${IMAGE}:${{ steps.v.outputs.tag }}" >/dev/null; then
            echo "::error::${IMAGE}:${{ steps.v.outputs.tag }} is not publicly pullable. Make the package public (GitHub > Packages > woow-ha-nextcloud-office-amd64 > Package settings > Change visibility), then re-run this workflow."
            exit 1
          fi

  release:
    name: Release
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@main
